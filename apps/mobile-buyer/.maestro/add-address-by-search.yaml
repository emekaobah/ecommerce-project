# A buyer adds a delivery address at checkout by searching for it and confirming the pin (#40).
# Needs the backend with GOOGLE_MAPS_API_KEY and the seeded shops, and a buyer already signed in
# (Clerk's native sign-in isn't driven here).
appId: com.emekaobah.oja.buyer
---
- launchApp:
    permissions:
      location: inuse
- tapOn: "Ofada Rice 5kg.*"
- tapOn: "Add to cart.*"
- tapOn: "View cart"
- tapOn: "Checkout.*"
# A cart with an address opens on it; go back to finding one.
- runFlow:
    when:
      visible: "Change"
    commands:
      - tapOn: "Change"
- runFlow:
    when:
      visible: "Search for an address"
    commands:
      - tapOn: "Search for an address"

- tapOn:
    id: "address-search"
- inputText: "Akin Adesola"
- extendedWaitUntil:
    visible: "Akin Adesola Street.*"
    timeout: 15000
- tapOn: "Akin Adesola Street.*"

# The pin map opens on the place found; the buyer confirms where the rider comes.
- extendedWaitUntil:
    visible: "Confirm the delivery spot"
    timeout: 15000
- tapOn: "Confirm pin"

# The search filled the street and state; the buyer reviews the form and adds the rest.
- assertVisible: "Akin Adesola Street.*"
- assertVisible: "Eti Osa"
- assertVisible: "Lagos"
# The field, not its label above it.
- tapOn:
    text: "First name"
    index: 1
- eraseText
- inputText: "Ada"
# The field, not its label above it.
- tapOn:
    text: "Last name"
    index: 1
- eraseText
- inputText: "Obi"
# The field, not its label above it.
- tapOn:
    text: "Landmark / directions for the rider (optional)"
    index: 1
- eraseText
- inputText: "Opposite the Mobil station"
- scrollUntilVisible:
    element: "Use this address"
# The field, not its label above it.
- tapOn:
    text: "Phone number"
    index: 1
- eraseText
- inputText: "08031234567"
# Tapping plain text puts the phone pad, which has no return key, away.
- tapOn: "Delivery pin placed on the map."
- tapOn: "Use this address"

# Saved with its pin: checkout quotes delivery to it.
- extendedWaitUntil:
    visible: "Pay with Paystack.*"
    timeout: 30000
- assertVisible: "Opposite the Mobil station"
