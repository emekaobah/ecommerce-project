# Fulfilment staff take a new order all the way to the courier (#8): accept, pick, pack, book its
# courier label, and hand it over once the courier confirms the pickup. A wiring smoke test against
# the e2e backend (`bun run --cwd packages/api e2e:backend`), whose Shipbubble fake confirms a
# pickup a few seconds after its label is booked; see the README. Needs a paid order for the
# grocery shop with a courier quote: run the buyer app's purchase-from-two-shops.yaml first.
# Scanning needs a real camera, so lines are ticked by hand.
appId: com.emekaobah.oja.vendor
env:
  MEMBER_EMAIL: grocery.staff@oja.test
  MEMBER_PASSWORD: supersecret
  SHOP: Iya Bisi Foodstuff
---
- launchApp
- runFlow:
    file: sign-in.yaml
    env:
      MEMBER_EMAIL: ${MEMBER_EMAIL}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD}
      SHOP: ${SHOP}
- extendedWaitUntil:
    visible: ${SHOP}
    timeout: 15000
# The New tile is selected and orders are newest first: open the newest one.
- tapOn: "Details"
# Accepting starts picking.
- tapOn: "Accept order"
- tapOn: "Continue picking"
- extendedWaitUntil:
    visible: "Picking · 0 of .*"
    timeout: 10000
- repeat:
    while:
      visible: ".*, 0 of .* picked"
    commands:
      - tapOn: ".*, 0 of .* picked"
- tapOn: "Packed"
- assertVisible: "Packed. Book the courier."
# Booking from the packed screen goes back to the order, its label booked.
- tapOn: "Book courier label"
- extendedWaitUntil:
    visible: "Courier booked.*"
    timeout: 20000
- assertVisible: ".*Waybill .*"
# The courier confirms the pickup a few seconds after booking; the order refreshes every minute,
# so allow two refreshes and a slow simulator.
- extendedWaitUntil:
    visible: "Courier on the way"
    timeout: 150000
# Handed to courier asks first: the rider may not have the parcel yet.
- tapOn: "Handed to courier"
- tapOn: "Yes, handed over"
- extendedWaitUntil:
    visible: "Handed to courier, done, By .*"
    timeout: 15000
