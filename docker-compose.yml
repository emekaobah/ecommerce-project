# Local development services. Postgres tracks Railway (18, .railway/railway.ts);
# Valkey 8 stands in for Railway's Redis 8.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: oja
      POSTGRES_PASSWORD: oja
      POSTGRES_DB: oja
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18 images keep data under a versioned directory in /var/lib/postgresql.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oja"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # BullMQ requires noeviction, which is also Redis's default on Railway.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres18-data:
  valkey-data:
