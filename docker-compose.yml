# Local development services. Postgres tracks Railway (16, pinned in .railway/railway.ts);
# Valkey 8 stands in for Railway's Redis 8.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oja
      POSTGRES_PASSWORD: oja
      POSTGRES_DB: oja
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oja"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # BullMQ requires noeviction, which is also Redis's default on Railway.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
