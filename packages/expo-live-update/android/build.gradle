plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.oja'
version = '0.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.ojaliveupdate"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
}
