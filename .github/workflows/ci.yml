name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oja
          POSTGRES_PASSWORD: oja
          POSTGRES_DB: oja
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U oja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # bun install peaks near 7 GB for this monorepo, more than the 8 GB runner can spare
      # (#50): extra swap keeps the kernel from killing it. See whether a Bun upgrade drops it.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile-bun
          sudo chmod 600 /swapfile-bun
          sudo mkswap /swapfile-bun
          sudo swapon /swapfile-bun
          free -m

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate route types
        run: bun run codegen

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test
