name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oja
          POSTGRES_PASSWORD: oja
          POSTGRES_DB: oja
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U oja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate route types
        run: bun run codegen

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test
