name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oja
          POSTGRES_PASSWORD: oja
          POSTGRES_DB: oja
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U oja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Diagnostic (PR #50): the install is killed when memory runs out on the 8 GB runner.
      # Sample memory and the biggest processes every 5s beside a verbose install, which
      # streams into the log (timestamped) so the spike can be matched to what Bun is doing.
      - name: Install
        run: |
          set -o pipefail
          ( while true; do echo "[mem] $(free -m | awk '/Mem:/ {print "used="$3"MB avail="$7"MB"}') top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s=%dMB ", $2, $1/1024}')"; sleep 5; done ) &
          watcher=$!
          bun install --frozen-lockfile --verbose 2>&1 | grep -vE '^(> HTTP|Cloning|\[[^]]+\] Extract)' || status=$?
          kill $watcher
          exit ${status:-0}

      - name: Generate route types
        run: bun run codegen

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test
